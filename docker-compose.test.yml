# Ephemeral Postgres for `npm test`. Deliberately a separate container and
# port (55432) from the dev database in docker-compose.yml (5432), so running
# the suite can never touch development data. Data lives in tmpfs and is
# wiped on `down` — the integration tests create and delete their own
# fixtures and assume a disposable database.
services:
  test-db:
    image: postgres:16-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: whatsapp_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: testpass
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d whatsapp_bot"]
      interval: 2s
      timeout: 3s
      retries: 15
