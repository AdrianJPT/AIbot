# Cloud Run deploy pipeline.
#
# Only NEXT_PUBLIC_* values are passed as build args: Next inlines those into
# the client bundle at build time, so they must be real here. Every other
# secret (APP_ENCRYPTION_KEY, SUPABASE_SERVICE_ROLE_KEY, WHATSAPP_APP_SECRET,
# INTERNAL_DRAIN_TOKEN, the database URLs) is injected at runtime from Secret
# Manager by the deploy step below, so no secret ever enters an image layer.
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_SITE_URL=https://<service-url>,_SUPABASE_URL=https://<ref>.supabase.co,_SUPABASE_ANON_KEY=<anon-key>

substitutions:
  _SERVICE: whatsapp-ai-bot
  _REGION: us-central1
  _SITE_URL: ""
  _SUPABASE_URL: ""
  _SUPABASE_ANON_KEY: ""

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_SERVICE}/app:${BUILD_ID}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_SERVICE}/app:${BUILD_ID}

  # Runs against the live database before the new revision serves traffic, so
  # the schema is always ahead of the code. The final image contains the
  # lockfile-resolved Prisma CLI copied from the builder, so migrations need no
  # package-manager resolution or network access.
  - id: migrate
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_SERVICE}/app:${BUILD_ID}
    dir: /app
    entrypoint: /app/node_modules/.bin/prisma
    args: [migrate, deploy]
    secretEnv: [DATABASE_URL, DIRECT_URL]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_SERVICE}/app:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --set-env-vars=NEXT_PUBLIC_SITE_URL=${_SITE_URL},NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,WEBHOOK_VERIFY_TOKEN=WEBHOOK_VERIFY_TOKEN:latest,WHATSAPP_APP_SECRET=WHATSAPP_APP_SECRET:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,APP_ENCRYPTION_KEY=APP_ENCRYPTION_KEY:latest,INTERNAL_DRAIN_TOKEN=INTERNAL_DRAIN_TOKEN:latest

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
    - versionName: projects/${PROJECT_ID}/secrets/DIRECT_URL/versions/latest
      env: DIRECT_URL

options:
  logging: CLOUD_LOGGING_ONLY
